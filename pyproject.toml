[project]
name = "gitlab-mcp"
version = "0.1.0"
description = "GitLab MCP server for fast developer workflows (no glab required)"
readme = "README.md"
authors = [
    { name = "Major Hayden", email = "major@mhtx.net" }
]
requires-python = ">=3.15"
dependencies = [
    "fastmcp==4.1.3",
    "httpx>=0.28.1",
]

[project.scripts]
gitlab-mcp = "gitlab_mcp:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pip-audit>=2.9",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=6",
    "pytest-randomly>=3.15",
    "pytest-socket>=0.8.1",
    "respx>=0.23.1",
    "ruff>=0.17.2",
    "ty>=0.0.1a1",
]

[tool.ty.environment]
python-version = "3.15"

[tool.ty.src]
include = ["src", "tests"]

[tool.ty.terminal]
error-on-warning = true

[tool.pytest.ini_options]
# Loopback tests can opt in with pytest.mark.allow_hosts(["127.0.0.1", "::1"]).
addopts = "--cov-context=test --disable-socket --allow-unix-socket"
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
src = [
    "src",
    "tests",
]
target-version = "py315"

[tool.ruff.lint]
preview = false
select = [
    "A",
    "ASYNC",
    "B",
    "BLE",
    "C4",
    "C90",
    "COM",
    "D",
    "DTZ",
    "E",
    "F",
    "FA",
    "FLY",
    "FURB",
    "G",
    "I",
    "ICN",
    "INP",
    "INT",
    "ISC",
    "LOG",
    "N",
    "NPY",
    "PERF",
    "PGH",
    "PIE",
    "PL",
    "PT",
    "PTH",
    "PYI",
    "Q",
    "RET",
    "RSE",
    "RUF",
    "S",
    "SIM",
    "SLF",
    "SLOT",
    "T10",
    "T20",
    "TC",
    "TID",
    "TRY",
    "UP",
    "W",
    "YTT",
]
# These rules conflict with Ruff's formatter.
ignore = [
    "COM812",
    "COM819",
    "D206",
    "D300",
    "E111",
    "E114",
    "E117",
    "Q000",
    "Q001",
    "Q002",
    "Q003",
    "Q004",
    "W191",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Pytest tests use assertions to check behavior.
"tests/**" = [
    "S101",
]

[tool.ruff.format]
quote-style = "double"

[tool.coverage.run]
core = "ctrace"
branch = true
patch = ["subprocess"]
source = ["gitlab_mcp"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.coverage.html]
show_contexts = true

[tool.uv]
default-groups = ["dev"]
required-version = "==0.13.5"
